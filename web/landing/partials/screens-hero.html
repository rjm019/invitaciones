<div class="phone phone--float" data-phone="hero" role="img" aria-label="Una invitación digital de boda abierta en un celular">
  <div class="phone__screen">
    <div class="screen screen--envelope {{inicio==|is-active}}" data-screen="sobre">
      <span class="screen__kicker">Para la familia Ruiz</span>
      <div class="envelope"></div>
      <span class="screen__small">Toca para abrir</span>
    </div>
    <div class="screen {{inicio==boda|is-active}}" data-screen="boda">
      <span class="screen__kicker">Nos casamos</span>
      <span class="screen__name">Valeria &amp; Andrés</span>
      <span class="screen__rule"></span>
      <span class="screen__date">20 · 03 · 2027</span>
      <span class="screen__small">Hacienda San Gabriel<br />Puebla</span>
      <span class="screen__btn">Confirmar asistencia</span>
    </div>
    <div class="screen {{inicio==xv|is-active}}" data-screen="xv">
      <span class="screen__kicker">Mis XV años</span>
      <span class="screen__name">Sofía</span>
      <div class="screen__digits">
        <span>124<small>días</small></span><span>08<small>horas</small></span><span>36<small>min</small></span>
      </div>
      <span class="screen__btn screen__btn--line">Agregar al calendario</span>
    </div>
    <div class="screen {{inicio==graduacion|is-active}}" data-screen="graduacion">
      <span class="screen__kicker">Generación 2026</span>
      <span class="screen__title">Diego Herrera</span>
      <span class="screen__rule"></span>
      <span class="screen__small">Ceremonia de graduación<br />y cena de gala</span>
      <span class="screen__date">10 · 07 · 2026</span>
      <span class="screen__btn">Ver ubicación</span>
    </div>
  </div>
</div>
