<section class="hero" aria-labelledby="titulo">
  <div class="wrap hero__grid">
    <div>
      <p class="eyebrow" data-reveal>{{eyebrow}}</p>
      <h1 id="titulo" data-reveal style="--i: 1">{{h1}} <span class="script">{{h1script}}</span></h1>
      <p class="hero__promise" data-reveal style="--i: 2">Hacemos posibles tus sueños. Nada es imposible para nosotros.</p>
      <p class="lead" data-reveal style="--i: 3">{{lead}}</p>
      <div class="hero__cta" data-reveal style="--i: 4">
        <a class="btn" href="#cotizar">Cotizar mi invitación</a>
        <a class="link-arrow" href="/e/demo-{{demo}}">Ver un ejemplo</a>
      </div>
    </div>
    <div class="hero__stage" data-reveal style="--i: 2">
      <!-- @include screens-hero.html inicio="{{inicio}}" -->
    </div>
  </div>
</section>
