<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Destellos plateados de cuatro puntas, con el centro blanco. -->
  <defs>
    <path id="d" d="M0 -10 C1 -2 2 -1 10 0 C2 1 1 2 0 10 C-1 2 -2 1 -10 0 C-2 -1 -1 -2 0 -10 Z"/>
    <radialGradient id="brillo">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#eef0f2"/>
      <stop offset="1" stop-color="#c4c8ce"/>
    </radialGradient>
  </defs>
  <g fill="url(#brillo)">
    <use href="#d" transform="translate(150 40) scale(1.7)"/>
    <use href="#d" transform="translate(44 64) scale(1.05)"/>
    <use href="#d" transform="translate(172 128) scale(0.85)"/>
    <use href="#d" transform="translate(28 160) scale(1.25)"/>
    <use href="#d" transform="translate(110 176) scale(0.6)"/>
    <use href="#d" transform="translate(96 22) scale(0.5)"/>
  </g>
</svg>
