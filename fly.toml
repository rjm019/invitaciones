# Fly.io: un solo servidor con la API y la invitación (Dockerfile de la raíz).
# Los eventos viven en el disco "eventos" montado en /data: no se borra al reiniciar ni al
# volver a publicar. Subir un evento: deploy/subir-evento.sh <slug>.
app = "APP_NAME"
primary_region = "dfw"
swap_size_mb = 256

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  APP_DEBUG = "false"
  APP_LOCALE = "es"
  LOG_CHANNEL = "stderr"
  LOG_LEVEL = "warning"
  EVENTOS_PATH = "/data/eventos"
  APP_URL = "https://APP_NAME.fly.dev"
  FRONTEND_URL = "https://APP_NAME.fly.dev"

[[mounts]]
  source = "eventos"
  destination = "/data"

# Se apaga sola sin visitas y despierta con la siguiente (casi no cobra).
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/up"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
