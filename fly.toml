# Fly.io: un solo servidor con la API y la invitación (Dockerfile de la raíz).
# Los eventos viven en el disco "eventos" montado en /data: no se borra al reiniciar ni al
# volver a publicar. Subir un evento: deploy/subir-evento.sh <slug>.
app = "invitaciones-jiro"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  APP_DEBUG = "false"
  APP_LOCALE = "es"
  LOG_CHANNEL = "stderr"
  LOG_LEVEL = "warning"
  EVENTOS_PATH = "/data/eventos"
  CACHE_FILE_PATH = "/data/cache"
  APP_URL = "https://invitaciones-jiro.fly.dev"
  FRONTEND_URL = "https://invitaciones-jiro.fly.dev"

[[mounts]]
  source = "eventos"
  destination = "/data"

# Sin visitas se suspende (guarda su memoria) y despierta en unos cientos de ms con la
# siguiente; solo se cobra mientras corre. Suspender no funciona con swap: por eso 512 MB.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/up"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
