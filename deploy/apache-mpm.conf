# Pocos procesos: la máquina de Fly es chica (512 MB). Cada uno atiende una petición a la
# vez y queda libre al terminar (KeepAlive Off); con 12 sobra para una invitación.
<IfModule mpm_prefork_module>
    StartServers            2
    MinSpareServers         1
    MaxSpareServers         4
    MaxRequestWorkers       12
    MaxConnectionsPerChild  500
</IfModule>
