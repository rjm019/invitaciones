# Pocos procesos: la máquina de Fly es chica (256-512 MB). Cada uno atiende varias
# peticiones; con 8 a la vez sobra para una invitación.
<IfModule mpm_prefork_module>
    StartServers            2
    MinSpareServers         1
    MaxSpareServers         3
    MaxRequestWorkers       8
    MaxConnectionsPerChild  500
</IfModule>
