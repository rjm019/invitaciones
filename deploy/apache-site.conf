# Sitio único: la API (Laravel) y la invitación compilada en /var/www/api/public.
<VirtualHost *:8080>
    DocumentRoot /var/www/api/public

    <Directory /var/www/api/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Archivos de la invitación con hash en el nombre: el navegador los guarda un año.
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
