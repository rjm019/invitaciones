# Sitio único: la API (Laravel) y la invitación compilada en /var/www/api/public.

# Delante está el proxy de Fly. Con prefork, una conexión que se queda abierta esperando
# ocupa un proceso entero y las demás peticiones hacen fila (se medían esperas de 1-5 s).
# Sin keep-alive, cada proceso queda libre en cuanto responde.
KeepAlive Off

# El JSON no se comprime aquí: el proxy de Fly ya lo comprime al salir (sin gastar la CPU de
# esta máquina). El HTML, el CSS y el JS los sigue comprimiendo el deflate.conf de Debian.
# Ojo: un AddOutputFilterByType dentro del VirtualHost reemplazaría esa lista, no se suma.

<VirtualHost *:8080>
    DocumentRoot /var/www/api/public

    <Directory /var/www/api/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Landing (páginas estáticas de web/landing/, compiladas en public/landing/): Apache las
    # entrega sin PHP en sus direcciones bonitas. La misma tabla vive en
    # web/landing/build/landingPlugin.ts (LANDING_ROUTES), que hace lo mismo en desarrollo.
    RewriteEngine On
    RewriteRule "^/$" "/landing/index.html" [PT,L]
    RewriteRule "^/invitaciones-digitales-(boda|xv-anos|graduacion)$" "/landing/$1.html" [PT,L]
    RewriteRule "^/aviso-de-privacidad$" "/landing/privacidad.html" [PT,L]
    RewriteRule "^/cotizacion-enviada$" "/landing/enviada.html" [PT,L]
    # Las páginas cambian con cada publicación: 5 minutos en caché (sus CSS y JS, un año).
    <Directory /var/www/api/public/landing>
        Header set Cache-Control "public, max-age=300"
    </Directory>

    # Archivos de la invitación con hash en el nombre: el navegador los guarda un año.
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    # Fotos, fondos y audio de cada evento (eventos/<slug>/media/): Apache los entrega directo
    # del disco, sin arrancar PHP por cada archivo, con las mismas reglas que MediaController:
    # solo archivos del primer nivel con estas extensiones ("_gestor", "originales/" y ".."
    # nunca coinciden). Además contesta 304 y rangos (el MP3). Lo que no coincida lo sigue
    # respondiendo Laravel; en desarrollo (artisan serve), todo.
    AliasMatch "^/media/([a-z0-9][a-z0-9-]{1,59})/([A-Za-z0-9][A-Za-z0-9._-]*\.(?i:webp|png|jpe?g|svg|gif|avif|mp3|m4a|ogg))$" "${EVENTOS_PATH}/$1/media/$2"
    <Directory "${EVENTOS_PATH}">
        Options None
        AllowOverride None
        Require all granted
        Header set Cache-Control "public, max-age=604800"
        Header set X-Robots-Tag "noindex, nofollow"
        Header set X-Content-Type-Options "nosniff"
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
